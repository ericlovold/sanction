name: Python SDK CI

on:
  push:
    paths:
      - "packages/sanction-python/**"
      - ".github/workflows/python-sdk-ci.yml"
  pull_request:
    paths:
      - "packages/sanction-python/**"
      - ".github/workflows/python-sdk-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sanction-python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: packages/sanction-python/uv.lock
      - name: Sync dependencies
        run: uv sync --frozen --all-groups
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy src tests
      - name: Pytest + coverage
        run: uv run pytest --cov=sanction_sdk --cov-fail-under=90
      - name: Build wheel
        run: uv build
