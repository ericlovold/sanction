[project]
name = "sanction-sdk"
version = "0.1.0"
description = "Python SDK for Sanction — tool authorization, token metering, and a LiteLLM callback"
readme = "README.md"
authors = [
    { name = "ericlovold", email = "140542120+ericlovold@users.noreply.github.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<0.29.0",
]

[project.urls]
Repository = "https://github.com/ericlovold/sanction"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.2.0,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.15.21,<0.16.0",
    "twine>=6.2.0,<7.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sanction_sdk", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["sanction_sdk"]

[tool.coverage.report]
fail_under = 90
show_missing = true
